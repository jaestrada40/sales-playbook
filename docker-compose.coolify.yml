services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_playbook
      POSTGRES_USER: sales_playbook
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_playbook -d sales_playbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sales_playbook:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/sales_playbook?schema=public
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      CORS_ORIGINS: ${SERVICE_URL_WEB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ENABLE_DEMO: "false"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

volumes:
  postgres-data:
